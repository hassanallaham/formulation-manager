[package]
name = "formulab"
version = "1.0.0"
description = "FormuLab — Formulation, Ingredient, Material & Supplier Desktop Manager"
authors = ["FormuLab"]
edition = "2021"

[lib]
name = "formulab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
